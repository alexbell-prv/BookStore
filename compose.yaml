name: bookstore

x-api: &api
  image: bookstore-api:local
  build:
    context: .
    target: api
  environment: &api-environment
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__BookStore: "Server=sqlserver,1433;Database=BookStore;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    ConnectionStrings__Identity: "Server=sqlserver,1433;Database=BookStore.Identity;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    OAuth__Issuer: http://localhost:5094
    OAuth__MetadataAddress: http://identityserver:8080/.well-known/openid-configuration
    OAuth__SwaggerRedirectUri: http://localhost:5093/swagger/oauth2-redirect.html
    Swagger__Enabled: "true"

x-identity: &identity
  image: bookstore-identity:local
  build:
    context: .
    target: identityserver
  environment: &identity-environment
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__Identity: "Server=sqlserver,1433;Database=BookStore.Identity;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    OAuth__Issuer: http://localhost:5094
    OAuth__SwaggerRedirectUri: http://localhost:5093/swagger/oauth2-redirect.html
    IdentityServer__KeyDirectory: /app/keys
  volumes:
    - identity-keys:/app/keys

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api-init:
    <<: *api
    command: ["--migrate"]
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy

  identity-init:
    <<: *identity
    environment:
      <<: *identity-environment
      OAuth__ManagementClientSecret: ${MANAGEMENT_CLIENT_SECRET:?Set MANAGEMENT_CLIENT_SECRET in .env}
    command: ["--migrate"]
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy

  identityserver:
    <<: *identity
    ports:
      - "127.0.0.1:5094:8080"
    depends_on:
      identity-init:
        condition: service_completed_successfully

  api:
    <<: *api
    ports:
      - "127.0.0.1:5093:8080"
    depends_on:
      api-init:
        condition: service_completed_successfully
      identityserver:
        condition: service_healthy

volumes:
  sql-data:
  identity-keys:
